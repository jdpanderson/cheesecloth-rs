[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.3.0"
authors = ["Jonathan Anderson <janderson@janderson.ca>"]
edition = "2024"
# The oldest Rust that builds the dependencies; CI checks it.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/jdpanderson/cheesecloth-rs"
homepage = "https://github.com/jdpanderson/cheesecloth-rs"
readme = "README.md"
publish = false

[workspace.dependencies]
cheesecloth-core = { path = "crates/cheesecloth-core" }
cheesecloth-net = { path = "crates/cheesecloth-net" }
cheesecloth-wg = { path = "crates/cheesecloth-wg" }
cheesecloth-daemon = { path = "crates/cheesecloth-daemon" }

anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
gotatun = { version = "0.9.2", default-features = false, features = ["device", "ring"] }
hostname = "0.4"
ed25519-dalek = "3"
if-addrs = "0.15"
ipnet = { version = "2", features = ["serde"] }
# The network type of GotaTun's peer API.
ipnetwork = "0.21"
libc = "0.2"
nl-wireguard = "0.3"
parking_lot = "0.12"
port-control-client = { version = "0.2.2", default-features = false, features = ["upnp", "pcp"] }
pnyx = "0.2"
postcard = { version = "1", default-features = false, features = ["use-std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.10"
rtnetlink = "0.23"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tun-rs = { version = "2.8.11", features = ["async_tokio"] }
windows-sys = "0.61"

# Every crate uses these (`[lints] workspace = true`).
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# A smaller and faster binary for the packages, at the cost of a slower build.
[profile.release]
lto = "thin"
codegen-units = 1
