serde.workspace = true
socket2.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
defguard_boringtun.workspace = true

[lints]
workspace = true
